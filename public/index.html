<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikGradation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f13;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, #a78bfa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    p.sub { color: #888; margin-bottom: 32px; font-size: 0.9rem; }

    .card {
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 560px;
    }

    label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 6px; }

    .drop-zone {
      border: 2px dashed #3a3a5a;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
      margin-bottom: 24px;
    }
    .drop-zone.drag-over { border-color: #a78bfa; }
    .drop-zone input[type="file"] { display: none; }
    .drop-zone .icon { font-size: 2.5rem; margin-bottom: 8px; }
    .drop-zone p { color: #888; font-size: 0.9rem; }
    .drop-zone .file-name { color: #a78bfa; margin-top: 8px; font-weight: 600; }

    .field { margin-bottom: 20px; }
    .row { display: flex; gap: 16px; }
    .row .field { flex: 1; }

    input[type="range"] {
      width: 100%;
      accent-color: #a78bfa;
    }
    .range-row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
    .range-val { font-size: 0.85rem; color: #a78bfa; }

    .bitrate-note {
      font-size: 0.78rem;
      color: #555;
      margin-top: 6px;
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #a78bfa, #38bdf8);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button[type="submit"]:disabled { opacity: 0.4; cursor: not-allowed; }

    .progress {
      display: none;
      margin-top: 20px;
      background: #0f0f18;
      border-radius: 8px;
      height: 8px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #a78bfa, #38bdf8);
      animation: indeterminate 1.5s infinite linear;
      width: 40%;
    }
    @keyframes indeterminate {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    .status { margin-top: 16px; font-size: 0.85rem; color: #888; text-align: center; }
    .status.error   { color: #f87171; }
    .status.success { color: #4ade80; }

    .preview-wrap {
      display: none;
      margin-top: 24px;
      background: repeating-conic-gradient(#222 0% 25%, #333 0% 50%) 0 0 / 16px 16px;
      border-radius: 10px;
      overflow: hidden;
    }
    video { display: block; width: 100%; max-height: 300px; object-fit: contain; }

    hr { border: none; border-top: 1px solid #2a2a3a; margin: 20px 0; }
  </style>
</head>
<body>
  <h1>TikGradation</h1>
  <p class="sub">MP4の上部を透過してWebMに変換</p>

  <div class="card">
    <div class="drop-zone" id="dropZone">
      <div class="icon">🎬</div>
      <p>クリックまたはドラッグでMP4をアップロード</p>
      <div class="file-name" id="fileName"></div>
      <input type="file" id="fileInput" accept="video/mp4,.mp4">
    </div>

    <div class="field">
      <label>透過範囲（上部 %）</label>
      <input type="range" id="topPercent" min="0" max="80" value="30">
      <div class="range-row">
        <span class="range-val" id="topVal">30%</span>
      </div>
    </div>

    <hr>

    <div class="row">
      <div class="field">
        <label>フェードイン（秒）</label>
        <input type="range" id="fadeIn" min="0" max="3" step="0.1" value="0.5">
        <div class="range-row">
          <span class="range-val" id="fadeInVal">0.5s</span>
        </div>
      </div>
      <div class="field">
        <label>フェードアウト（秒）</label>
        <input type="range" id="fadeOut" min="0" max="3" step="0.1" value="0.5">
        <div class="range-row">
          <span class="range-val" id="fadeOutVal">0.5s</span>
        </div>
      </div>
    </div>

    <div class="bitrate-note">出力: VP9 CRF30（可変ビットレート・品質固定） / 音声: Opus 128kbps（フェードイン/アウト含む） / フレームレート・音声はそのまま維持</div>

    <hr>

    <button type="submit" id="submitBtn" disabled>変換する</button>

    <div class="progress" id="progress"><div class="progress-bar"></div></div>
    <div class="status" id="status"></div>

    <div class="preview-wrap" id="previewWrap">
      <video id="preview" controls loop autoplay muted></video>
    </div>
  </div>

  <script>
    const dropZone   = document.getElementById('dropZone');
    const fileInput  = document.getElementById('fileInput');
    const fileName   = document.getElementById('fileName');
    const topPercent = document.getElementById('topPercent');
    const fadeIn     = document.getElementById('fadeIn');
    const fadeOut    = document.getElementById('fadeOut');
    const submitBtn  = document.getElementById('submitBtn');
    const progress   = document.getElementById('progress');
    const status     = document.getElementById('status');
    const previewWrap = document.getElementById('previewWrap');
    const preview    = document.getElementById('preview');
    let selectedFile = null;

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const f = e.dataTransfer.files[0];
      if (f) setFile(f);
    });
    fileInput.addEventListener('change', () => { if (fileInput.files[0]) setFile(fileInput.files[0]); });

    function setFile(f) {
      selectedFile = f;
      fileName.textContent = f.name;
      submitBtn.disabled = false;
    }

    topPercent.addEventListener('input', () => { document.getElementById('topVal').textContent      = topPercent.value + '%'; });
    fadeIn.addEventListener('input',     () => { document.getElementById('fadeInVal').textContent   = parseFloat(fadeIn.value).toFixed(1) + 's'; });
    fadeOut.addEventListener('input',    () => { document.getElementById('fadeOutVal').textContent  = parseFloat(fadeOut.value).toFixed(1) + 's'; });

    submitBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      submitBtn.disabled = true;
      progress.style.display = 'block';
      previewWrap.style.display = 'none';
      status.textContent = '変換中...';
      status.className = 'status';

      const formData = new FormData();
      formData.append('video',      selectedFile);
      formData.append('topPercent', topPercent.value);
      formData.append('fadeIn',     fadeIn.value);
      formData.append('fadeOut',    fadeOut.value);

      try {
        const res = await fetch('/convert', { method: 'POST', body: formData });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ error: 'サーバーエラー' }));
          throw new Error(err.error || 'エラーが発生しました');
        }

        const blob = await res.blob();
        const url  = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = `output_${Date.now()}.webm`;
        a.click();

        preview.src = url;
        previewWrap.style.display = 'block';

        status.textContent = '変換完了！ダウンロードを開始しました。';
        status.className = 'status success';
      } catch (e) {
        status.textContent = e.message;
        status.className = 'status error';
      } finally {
        progress.style.display = 'none';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
