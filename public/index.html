<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikGradation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f13;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, #a78bfa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    p.sub { color: #888; margin-bottom: 32px; font-size: 0.9rem; }

    .card {
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 560px;
    }

    label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 6px; }

    .drop-zone {
      border: 2px dashed #3a3a5a;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
      margin-bottom: 24px;
    }
    .drop-zone.drag-over { border-color: #a78bfa; }
    .drop-zone input[type="file"] { display: none; }
    .drop-zone .icon { font-size: 2.5rem; margin-bottom: 8px; }
    .drop-zone p { color: #888; font-size: 0.9rem; }
    .drop-zone .file-name { color: #a78bfa; margin-top: 8px; font-weight: 600; }

    .field { margin-bottom: 20px; }
    .row { display: flex; gap: 16px; }
    .row .field { flex: 1; }

    input[type="range"] {
      width: 100%;
      accent-color: #a78bfa;
    }
    .range-row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
    .range-val { font-size: 0.85rem; color: #a78bfa; }

    .bitrate-note {
      font-size: 0.78rem;
      color: #555;
      margin-top: 6px;
    }

    .notice {
      font-size: 0.82rem;
      color: #f0a500;
      background: rgba(240, 165, 0, 0.08);
      border: 1px solid rgba(240, 165, 0, 0.25);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #a78bfa, #38bdf8);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button[type="submit"]:disabled { opacity: 0.4; cursor: not-allowed; }

    .progress {
      display: none;
      margin-top: 20px;
      background: #0f0f18;
      border-radius: 8px;
      height: 8px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #a78bfa, #38bdf8);
      width: 0%;
      transition: width 0.2s ease;
    }
    .progress-meta {
      display: none;
      margin-top: 8px;
      font-size: 0.8rem;
      color: #a78bfa;
      text-align: right;
    }

    .status { margin-top: 16px; font-size: 0.85rem; color: #888; text-align: center; }
    .status.error   { color: #f87171; }
    .status.success { color: #4ade80; }

    .preview-wrap {
      display: none;
      margin-top: 24px;
      background: repeating-conic-gradient(#222 0% 25%, #333 0% 50%) 0 0 / 16px 16px;
      border-radius: 10px;
      overflow: hidden;
    }
    video { display: block; width: 100%; max-height: 300px; object-fit: contain; }

    hr { border: none; border-top: 1px solid #2a2a3a; margin: 20px 0; }

    .promo {
      margin-top: 24px;
      width: 100%;
      max-width: 560px;
    }
    .promo a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: linear-gradient(135deg, #1a0a2e 0%, #0a1a2e 100%);
      border: 1px solid transparent;
      background-clip: padding-box;
      border-radius: 14px;
      padding: 20px 24px;
      text-decoration: none;
      color: #e0e0e0;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s;
    }
    .promo a::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 14px;
      padding: 1px;
      background: linear-gradient(135deg, #fe2c55, #25f4ee);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .promo a:hover { transform: translateY(-2px); }
    .promo .promo-left { display: flex; align-items: center; gap: 14px; }
    .promo .promo-icon {
      font-size: 1.8rem;
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #fe2c55 0%, #25f4ee 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .promo .promo-text { display: flex; flex-direction: column; gap: 3px; }
    .promo .promo-title { font-weight: 700; font-size: 0.95rem; }
    .promo .promo-sub { font-size: 0.78rem; color: #888; }
    .promo .promo-arrow {
      font-size: 1.1rem;
      background: linear-gradient(135deg, #fe2c55, #25f4ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      flex-shrink: 0;
    }
    .promo-sister a::before {
      background: linear-gradient(135deg, #a78bfa, #38bdf8);
    }
    .promo-sister .promo-icon {
      background: linear-gradient(135deg, #a78bfa 0%, #38bdf8 100%);
    }
    .promo-sister .promo-arrow {
      background: linear-gradient(135deg, #a78bfa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>
  <h1>TikGradation</h1>
  <p class="sub">MP4 / MOVを上部透過エフェクト動画に変換</p>

  <div class="card">
    <div class="drop-zone" id="dropZone">
      <div class="icon">🎬</div>
      <p>クリックまたはドラッグでMP4 / MOVをアップロード</p>
      <div class="file-name" id="fileName"></div>
      <input type="file" id="fileInput" accept="video/mp4,video/quicktime,.mp4,.mov">
    </div>

    <div class="field">
      <label>透過範囲（上部 %）</label>
      <input type="range" id="topPercent" min="0" max="80" value="30">
      <div class="range-row">
        <span class="range-val" id="topVal">30%</span>
      </div>
    </div>

    <hr>

    <div class="row">
      <div class="field">
        <label>フェードイン（秒）</label>
        <input type="range" id="fadeIn" min="0" max="3" step="0.1" value="0.5">
        <div class="range-row">
          <span class="range-val" id="fadeInVal">0.5s</span>
        </div>
      </div>
      <div class="field">
        <label>フェードアウト（秒）</label>
        <input type="range" id="fadeOut" min="0" max="3" step="0.1" value="0.5">
        <div class="range-row">
          <span class="range-val" id="fadeOutVal">0.5s</span>
        </div>
      </div>
    </div>

    <hr>

    <p class="notice">⚠️ 透過動画は通常のプレイヤーでは再生できません。配信用オーバーレイ機能で再生してください。</p>

    <button type="submit" id="submitBtn" disabled>変換する</button>

  <div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>
  <div class="progress-meta" id="progressMeta">0%</div>
    <div class="status" id="status"></div>

    <div class="preview-wrap" id="previewWrap" style="display:none">
    </div>
  </div>

  <div class="promo">
    <a href="https://www.tiktok.com/@yu_ki_nojo" target="_blank" rel="noopener noreferrer">
      <div class="promo-left">
        <div class="promo-icon">💻</div>
        <div class="promo-text">
          <span class="promo-title">PC配信環境の相談、コンサルティングはこちら</span>
          <span class="promo-sub">@yu_ki_nojo のTikTokをチェック</span>
        </div>
      </div>
      <div class="promo-arrow">→</div>
    </a>
  </div>

  <div class="promo promo-sister">
    <a href="https://tikring.graphica-produce.com/" target="_blank" rel="noopener noreferrer">
      <div class="promo-left">
        <div class="promo-icon">🔗</div>
        <div class="promo-text">
          <span class="promo-title">TikRing - アイコンフレーム装着支援</span>
          <span class="promo-sub">姉妹サイト</span>
        </div>
      </div>
      <div class="promo-arrow">→</div>
    </a>
  </div>

  <script>
    const dropZone   = document.getElementById('dropZone');
    const fileInput  = document.getElementById('fileInput');
    const fileName   = document.getElementById('fileName');
    const topPercent = document.getElementById('topPercent');
    const fadeIn     = document.getElementById('fadeIn');
    const fadeOut    = document.getElementById('fadeOut');
    const submitBtn  = document.getElementById('submitBtn');
    const progress   = document.getElementById('progress');
    const progressBar = document.getElementById('progressBar');
    const progressMeta = document.getElementById('progressMeta');
    const status     = document.getElementById('status');
    let selectedFile = null;
    let pollTimer = null;
    let convertedBlob = null;
    let convertedUrl = null;
    let convertedFileName = '';
    let downloadReady = false;

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const f = e.dataTransfer.files[0];
      if (f) setFile(f);
    });
    fileInput.addEventListener('change', () => { if (fileInput.files[0]) setFile(fileInput.files[0]); });

    function setFile(f) {
      resetDownloadState();

      // 30秒チェック（クライアント側プリチェック）
      const tempUrl = URL.createObjectURL(f);
      const tempVid = document.createElement('video');
      tempVid.preload = 'metadata';
      tempVid.src = tempUrl;
      tempVid.onloadedmetadata = () => {
        URL.revokeObjectURL(tempUrl);
        if (tempVid.duration > 30) {
          status.textContent = '30秒以上の動画はアップロードできません。';
          status.className = 'status error';
          selectedFile = null;
          fileName.textContent = '';
          submitBtn.disabled = true;
          fileInput.value = '';
        } else {
          selectedFile = f;
          fileName.textContent = f.name;
          status.textContent = '';
          status.className = 'status';
          submitBtn.disabled = false;
        }
      };
    }

    topPercent.addEventListener('input', () => { document.getElementById('topVal').textContent      = topPercent.value + '%'; });
    fadeIn.addEventListener('input',     () => { document.getElementById('fadeInVal').textContent   = parseFloat(fadeIn.value).toFixed(1) + 's'; });
    fadeOut.addEventListener('input',    () => { document.getElementById('fadeOutVal').textContent  = parseFloat(fadeOut.value).toFixed(1) + 's'; });

    topPercent.addEventListener('change', resetDownloadState);
    fadeIn.addEventListener('change', resetDownloadState);
    fadeOut.addEventListener('change', resetDownloadState);

    function setProgress(value) {
      const safeValue = Math.max(0, Math.min(100, Math.round(value)));
      progressBar.style.width = safeValue + '%';
      progressMeta.textContent = safeValue + '%';
    }

    function showProgress() {
      progress.style.display = 'block';
      progressMeta.style.display = 'block';
    }

    function hideProgress() {
      progress.style.display = 'none';
      progressMeta.style.display = 'none';
    }

    function stopPolling() {
      if (pollTimer) {
        clearTimeout(pollTimer);
        pollTimer = null;
      }
    }

    function resetDownloadState() {
      downloadReady = false;
      convertedBlob = null;
      convertedFileName = '';
      submitBtn.textContent = '変換する';

      if (convertedUrl) {
        URL.revokeObjectURL(convertedUrl);
        convertedUrl = null;
      }
    }

    async function fetchConvertedBlob(downloadUrl) {
      const res = await fetch(downloadUrl);
      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: '変換ファイルの取得に失敗しました。' }));
        throw new Error(err.error || '変換ファイルの取得に失敗しました。');
      }

      return res.blob();
    }

    async function saveConvertedFile() {
      if (!convertedBlob) return;

      const a = document.createElement('a');
      a.href = convertedUrl;
      a.download = convertedFileName;
      a.click();
      return { usedSavePicker: false };
    }

    function uploadConversion(formData) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/convert');
        xhr.responseType = 'json';

        xhr.upload.addEventListener('progress', event => {
          if (!event.lengthComputable) return;
          const percent = (event.loaded / event.total) * 100;
          setProgress(percent);
          status.textContent = `アップロード中... ${Math.round(percent)}%`;
        });

        xhr.addEventListener('load', () => {
          const response = xhr.response || {};
          if (xhr.status >= 200 && xhr.status < 300 && response.jobId) {
            resolve(response);
            return;
          }

          reject(new Error(response.error || 'エラーが発生しました'));
        });

        xhr.addEventListener('error', () => {
          reject(new Error('通信エラーが発生しました'));
        });

        xhr.send(formData);
      });
    }

    async function pollJob(jobId) {
      return new Promise((resolve, reject) => {
        const tick = async () => {
          try {
            const res = await fetch(`/jobs/${jobId}`);
            const data = await res.json();

            if (!res.ok) {
              throw new Error(data.error || '進捗の取得に失敗しました');
            }

            setProgress(data.progress || 0);
            status.textContent = `${data.phase}... ${Math.round(data.progress || 0)}%`;
            status.className = 'status';

            if (data.status === 'completed') {
              stopPolling();
              resolve(data);
              return;
            }

            if (data.status === 'failed') {
              stopPolling();
              reject(new Error(data.error || '変換に失敗しました'));
              return;
            }

            pollTimer = setTimeout(tick, 700);
          } catch (error) {
            stopPolling();
            reject(error);
          }
        };

        tick();
      });
    }

    submitBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      if (downloadReady) {
        try {
          submitBtn.disabled = true;
          status.textContent = 'ダウンロードを開始しています...';
          status.className = 'status';
          await saveConvertedFile();
          status.textContent = 'ブラウザの通常ダウンロードを開始しました。';
          status.className = 'status success';
        } catch (e) {
          status.textContent = e.message;
          status.className = 'status error';
        } finally {
          submitBtn.disabled = false;
        }
        return;
      }

      submitBtn.disabled = true;
      showProgress();
      setProgress(0);
      status.textContent = 'アップロードを開始します...';
      status.className = 'status';

      const formData = new FormData();
      formData.append('video',      selectedFile);
      formData.append('topPercent', topPercent.value);
      formData.append('fadeIn',     fadeIn.value);
      formData.append('fadeOut',    fadeOut.value);

      try {
        resetDownloadState();
        const { jobId } = await uploadConversion(formData);
        setProgress(5);
        status.textContent = '変換を開始しています...';

        const job = await pollJob(jobId);
        status.textContent = '変換ファイルを準備しています...';
        convertedBlob = await fetchConvertedBlob(job.downloadUrl);
        convertedUrl = URL.createObjectURL(convertedBlob);
        convertedFileName = `output_${Date.now()}.webm`;
        downloadReady = true;
        submitBtn.textContent = 'ダウンロードする';

        setProgress(100);
        hideProgress();

        status.textContent = '変換完了。ダウンロードボタンから保存してください。';
        status.className = 'status success';
      } catch (e) {
        hideProgress();
        status.textContent = e.message;
        status.className = 'status error';
      } finally {
        stopPolling();
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
